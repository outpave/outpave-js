<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card viewer example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #1f2933;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input,
      button {
        font: inherit;
        padding: 8px 12px;
      }
      input {
        flex: 1;
        min-width: 0;
      }
      #status {
        min-height: 1.5em;
      }
      #status[data-tone="error"] {
        color: #b42318;
      }
      #status[data-tone="ok"] {
        color: #067647;
      }
      [data-embedded-card-viewer] {
        display: grid;
        gap: 12px;
      }
      [data-field] {
        display: grid;
        gap: 4px;
      }
      [data-field] > span {
        font-size: 14px;
        color: #52606d;
      }
    </style>
    <script type="importmap">
      { "imports": { "@outpave/outpave-js": "/vendor/outpave-js.js" } }
    </script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <h1>Card viewer example</h1>
    <form id="card-form">
      <input name="cardId" aria-label="Card ID" placeholder="Card ID" autocomplete="off" required />
      <button>Show card</button>
    </form>
    <p id="status" role="status"></p>
    <div id="card-details"></div>
  </body>
</html>
